<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wie mag beginnen?</title>

<style>
body{
  margin:0;
  font-family:-apple-system, sans-serif;
  background:#0b0f1a;
  color:white;
  display:grid;
  place-items:center;
  min-height:100vh;
}
.app{
  width:90%;
  max-width:500px;
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:18px;
}
button{
  padding:12px 18px;
  border-radius:12px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  background:#2b6cff;
  color:white;
  margin:5px;
}
.ghost{
  background:rgba(255,255,255,0.15);
}
.name{
  font-size:34px;
  font-weight:900;
}
textarea{
  width:100%;
  height:100px;
  background:rgba(0,0,0,0.3);
  color:white;
  border-radius:10px;
  border:none;
  padding:10px;
}
</style>

</head>
<body>
<div class="app" id="app">
  <canvas id="confetti"></canvas>
  <h1>Wie mag beginnen?</h1>
  <div class="sub">Druk op “Draai” en hij kiest random.</div>

  <div class="result" id="resultBox">
    <p class="name" id="pickedName">—</p>
    <p class="hint" id="pickedHint">Klaar? Draai maar.</p>
  </div>

  <div class="row">
    <button id="spinBtn">🎲 Draai</button>
    <button class="ghost" id="resetBtn">Reset</button>
  </div>

  <div class="namesBox">
    <label>
      <input type="checkbox" id="noRepeat" checked>
      Niet 2x dezelfde achter elkaar
    </label>
    <br><br>
    <label>
      <input type="checkbox" id="sound">
      Geluid
    </label>
    <br><br>
    <textarea id="namesInput" spellcheck="false">Mama
Papa
Nora
Indy</textarea>
  </div>
</div>
</body>
</html>
